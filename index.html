<style>
/* Layout: one study column — deck header, progress strip, mode tabs, then a single index-card stage. Notebook notation (= # ( )) is the visual system. */
:root{
  --paper:#F2F5EF; --card:#FFFFFF; --ink:#15201A; --muted:#58665C; --line:#D5DDD0; --rule:#E8EDE4;
  --moss:#3B6A1D; --moss-ink:#FFFFFF; --moss-soft:#E2EDD4;
  --ant:#A6372F; --ant-soft:#F6E0DC; --gold:#8C6200; --gold-soft:#F4E8C6; --margin:#D88A80;
  --shadow:0 1px 0 rgba(21,32,26,.05), 0 8px 24px -12px rgba(21,32,26,.18);
  --f-display:'Literata', Georgia, 'Times New Roman', serif;
  --f-body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-ipa:'Gentium Book Plus', 'Charis SIL', 'Noto Serif', 'Times New Roman', serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1411; --card:#18201B; --ink:#E5ECE2; --muted:#98A69B; --line:#2C3830; --rule:#222B25;
  --moss:#A3CF72; --moss-ink:#132009; --moss-soft:#23331A;
  --ant:#EE8F86; --ant-soft:#3B201D; --gold:#E3BA55; --gold-soft:#3A2F14; --margin:#8E4B44;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F1411; --card:#18201B; --ink:#E5ECE2; --muted:#98A69B; --line:#2C3830; --rule:#222B25;
  --moss:#A3CF72; --moss-ink:#132009; --moss-soft:#23331A;
  --ant:#EE8F86; --ant-soft:#3B201D; --gold:#E3BA55; --gold-soft:#3A2F14; --margin:#8E4B44;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{width:46px;height:46px;flex:none;border-radius:10px;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;
  font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
h1{font-size:1.65rem;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.topright{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;min-width:0;flex:0 1 auto}
.deckpick{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.topright .btn{padding-block:9px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,.input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
select{appearance:auto}

/* stats */
.stats{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--rule)}
.bar i{display:block;height:100%}
.bar .m{background:var(--moss)} .bar .l{background:var(--gold)}
.statline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted);align-items:center}
.statline b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.legend code{font-family:var(--f-display);font-weight:700;font-size:1rem;margin-right:3px}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss);font-weight:600}
.tab:hover{color:var(--ink)}

/* generic */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{color:var(--ant);border-color:var(--ant)}
.btn.small{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--card);border-radius:99px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;color:var(--muted)}
.speak:hover{color:var(--moss);border-color:var(--moss)}
.speak svg{width:16px;height:16px}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:1.05rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;font-size:.88rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--moss-soft);color:var(--ink);font-weight:600}
.count{font-variant-numeric:tabular-nums}

/* entry detail: the notebook notation */
.detail{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:baseline}
.sym{font-family:var(--f-display);font-weight:700;font-size:1.25rem;width:1.1em;flex:none;text-align:center;line-height:1}
.sym.eq{color:var(--moss)} .sym.neq{color:var(--ant)} .sym.root{color:var(--gold);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{padding:3px 10px;border-radius:7px;background:var(--moss-soft);font-size:.95rem}
.chip.a{background:var(--ant-soft)}
.chip.def{background:none;padding:0;font-style:italic;font-family:var(--f-display);font-size:1.05rem}
.chip.say{border:0;display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.3;padding:5px 10px;max-width:100%}
.chip.say:hover{box-shadow:inset 0 0 0 1px var(--moss)}
.chip.a.say:hover{box-shadow:inset 0 0 0 1px var(--ant)}
.ct{display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.ct svg{width:12px;height:12px;opacity:.5;flex:none}
.chip.say:hover .ct svg{opacity:1}
.cipa{font-family:var(--f-ipa);font-size:.84rem;color:var(--muted)}
.rootnote{font-size:.92rem;font-style:italic;color:var(--muted)}
.line.vi{border-top:1px dashed var(--line);padding-top:10px;align-items:center}
.sym.vn{font-family:var(--f-body);font-size:.68rem;font-weight:700;letter-spacing:.04em;color:var(--paper);background:var(--ink);border-radius:4px;padding:3px 0;width:1.9em}
.vitext{font-weight:500;font-size:1rem;min-width:0;overflow-wrap:anywhere}

<script>

/* ---------- helpers ---------- */

/* ---------- part of speech ---------- */
const POS={n:['n','danh từ'], v:['v','động từ'], adj:['adj','tính từ'], adv:['adv','trạng từ'], prep:['prep','giới từ'], conj:['conj','liên từ'], pron:['pron','đại từ'], interj:['interj','thán từ'], phr:['phr','cụm từ']};

/* ---------- format: word [pos] = syn, syn #ant, ant (root = meaning) /ipa/ | vi ---------- */
function splitTop(s){
  const out=[]; let depth=0, q=false, cur='';

function parseText(text){
  const entries=[], bad=[];
  text.split(/\r?\n/).forEach((l,n)=>{ const e=parseLine(l); if(!e) return; if(e.bad) bad.push(n+1); else entries.push(e); });
  return {entries, bad};
}
const q = s => s.includes(',') ? `"${s}"` : s;
const toLine = e => `${e.w}${e.pos?` [${e.pos}]`:''} = ${e.syn.map(q).join(', ')}${e.ant.length?' #'+e.ant.map(q).join(', '):''}${(e.notes||[]).map(n=>` (${n})`).join('')}${e.ipa?` /${e.ipa}/`:''}${e.vi||e.ex?` | ${e.vi||''}`:''}${e.ex?` | ex: ${e.ex}${e.exVi?` // ${e.exVi}`:''}`:''}`;
const synText = (e,n=3) => e.syn.slice(0,n).join(', ');

/* ---------- pronunciation of synonyms / antonyms ---------- */
const BUILTIN_PRON = Object.fromEntries(Object.entries({
  'night-active':'ˌnaɪt ˈæktɪv','after-dark':'ˌɑːftə ˈdɑːk','nighttime':'ˈnaɪttaɪm','diurnal':'daɪˈɜːnl',
  'dangerously':'ˈdeɪndʒərəsli','seriously':'ˈsɪəriəsli','severely':'sɪˈvɪəli','slightly':'ˈslaɪtli',
  'highly threatened':'ˈhaɪli ˈθretnd','on the brink of extinction':'ɒn ðə ˈbrɪŋk əv ɪkˈstɪŋkʃn','scarce':'skeəs','secure':'sɪˈkjʊə',
  'unusual':'ʌnˈjuːʒuəl','uncommon':'ʌnˈkɒmən','distinctive':'dɪˈstɪŋktɪv','common':'ˈkɒmən',
  'light (in color)':'laɪt (ɪn ˈkʌlə)','faint':'feɪnt','blanched':'blɑːntʃt','bright':'braɪt','clear':'klɪə',
  'mainly':'ˈmeɪnli','primarily':'ˈpraɪmərəli','chiefly':'ˈtʃiːfli','rarely':'ˈreəli',
  'facing ahead':'ˈfeɪsɪŋ əˈhed','oriented to the front':'ˈɔːrientɪd tə ðə ˈfrʌnt','front-directed':'ˌfrʌnt daɪˈrektɪd','backward-facing':'ˈbækwəd ˌfeɪsɪŋ',
  'somewhat':'ˈsʌmwɒt','comparatively':'kəmˈpærətɪvli','fairly':'ˈfeəli',
  'lifetime':'ˈlaɪftaɪm','years of life':'ˌjɪəz əv ˈlaɪf','life cycle':'ˈlaɪf ˌsaɪkl',
  'looking like an owl':'ˈlʊkɪŋ laɪk ən ˈaʊl'
}).map(([k,v])=>[norm(k),v]));
/* a one-line definition (not a synonym): shown in italics, no pronunciation */
const isDef = (e,s) => e.syn.length===1 && e.syn[0]===s && (/^(a|an|the)\s/i.test(s) || s.includes(',') || !pronOK(s));
const pronOK = s => s.trim().split(/\s+/).length<=5;
/* the local app ships an offline pronunciation dictionary (ipa-dict.js); the web version simply has none */
let IPA_MAP=null;
function ipaOffline(p){
  if(!window.SOTU_IPA_DATA) return '';
  if(!IPA_MAP){ IPA_MAP=new Map(); for(const l of window.SOTU_IPA_DATA.split('\n')){ const i=l.indexOf(' '); IPA_MAP.set(l.slice(0,i), l.slice(i+1)); } }
  const parts=String(p).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[()]/g,' ').trim().split(/\s+/);
  if(!parts[0] || parts.length>5) return '';
  const out=[];
  for(const w of parts){ const r=w.split('-').map(x=>IPA_MAP.get(x.replace(/[^a-z]/g,''))); if(r.some(x=>!x)) return ''; out.push(r.join('-')); }
  return out.join(' ');
}
const ipaOf = (e,s) => e.si?.[norm(s)] || BUILTIN_PRON[norm(s)] || ipaOffline(s);
const MINI_SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
function chip(e,s,cls=''){
  if(isDef(e,s)) return `<span class="chip def">${esc(s)}</span>`;
  const ipa=ipaOf(e,s);
  const inner=`<span class="ct">${esc(s)}${canSpeak?MINI_SPK:''}</span>${ipa?`<span class="cipa">/${esc(ipa)}/</span>`:''}`;
  return canSpeak
    ? `<button type="button" class="chip say ${cls}" data-act="speak" data-w="${esc(s.replace(/[()]/g,''))}" aria-label="Nghe phát âm ${esc(s)}">${inner}</button>`
    : `<span class="chip ${cls}">${inner}</span>`;
}
function missingPron(d){
  const out=new Map();
  for(const e of d.words) for(const s of [...e.syn,...e.ant]){ if(isDef(e,s) || !pronOK(s)) continue; if(!ipaOf(e,s)) out.set(norm(s), s); }
  return out;
}

/* ---------- storage: private per-viewer store when available, else this browser ---------- */
const store = {
  kind:'local', col:null,
  async init(){
    if(!window.claude?.use) return;
    try{
      const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user) return;
      const id=await user.id(); if(!id) return;
      this.col=db.collection('data/users/'+id); this.kind='db';
    }catch{}
  },
  local(){ try{ return JSON.parse(localStorage.getItem('sotu.decks')||'[]'); }catch{ return []; } },
  async all(){
    if(this.kind==='db'){ const s=await this.col.get(); return s.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()})); }
    return this.local();
  },
  async put(d){
    const body={name:d.name, words:d.words, progress:d.progress||{}, created:d.created||Date.now()};
    if(d.deleted) body.deleted=true;
    if(this.kind==='db') return this.col.doc(d.id).set(body);
    try{ const all=this.local(); const i=all.findIndex(x=>x.id===d.id); const rec={id:d.id,...body}; if(i>=0) all[i]=rec; else all.push(rec); localStorage.setItem('sotu.decks',JSON.stringify(all)); }catch{}
  },
  async del(id){
    if(this.kind==='db') return this.col.doc(id).delete();
    try{ localStorage.setItem('sotu.decks',JSON.stringify(this.local().filter(x=>x.id!==id))); }catch{}
  }
};
const saveT={}, saving={};
function scheduleSave(d){ clearTimeout(saveT[d.id]); saveT[d.id]=setTimeout(()=>flush(d.id),700); }
async function flush(id){
  if(saving[id]){ saving[id].again=true; return; }
  const d=decks.get(id); if(!d) return;
  saving[id]={again:false};
  try{ await store.put(d); }
  catch(e){ toast(e?.code==='quota_exceeded' ? 'Hết dung lượng lưu. Hãy xoá bớt bài cũ.' : 'Chưa lưu được tiến độ. Sẽ thử lại ở lần trả lời sau.'); }
  const again=saving[id].again; delete saving[id];
  if(again) flush(id);
}

/* ---------- state ---------- */
const BUILTIN_ID='mau-kakapo';
const decks=new Map();
decks.set(BUILTIN_ID,{id:BUILTIN_ID, name:'Kākāpō (bài mẫu)', words:parseText(BUILTIN_TEXT).entries, progress:{}, builtin:true, created:0});
const MODES=[['list','Danh sách'],['cards','Thẻ ghi nhớ'],['quiz','Trắc nghiệm'],['syn','Bài tập đồng nghĩa'],['type','Gõ từ'],['match','Ghép cặp'],['decks','Bài học']];
let curId=BUILTIN_ID, mode='cards';
try{ const s=JSON.parse(localStorage.getItem('sotu.ui')||'{}'); if(s.mode && MODES.some(m=>m[0]===s.mode)) mode=s.mode; if(s.cur) curId=s.cur; }catch{}
const ALL_ID='__all';
const validCur = () => { if(curId!==ALL_ID && !decks.has(curId)) curId = decks.has(BUILTIN_ID) ? BUILTIN_ID : (sortedDecks()[0]?.id || ALL_ID); };
validCur();
const saveUI = () => { try{ localStorage.setItem('sotu.ui',JSON.stringify({mode,cur:curId})); }catch{} };
/* "Tất cả từ đã lưu": every saved word from every deck, each word remembering which deck owns its progress */
let allCache=null;
const invalidateAll = () => { allCache=null; };
const sortedDecks = () => [...decks.values()].sort((a,b)=>(a.created||0)-(b.created||0));
function allDeck(){
  if(!allCache){
    const words=[], seen=new Set();
    for(const d of sortedDecks()) for(const e of d.words){ const k=norm(e.w); if(seen.has(k)) continue; seen.add(k); words.push({...e, _d:d.id}); }
    allCache={id:ALL_ID, name:'Tất cả từ đã lưu', words, virtual:true};
  }
  const progress={};
  for(const e of allCache.words){ const p=decks.get(e._d)?.progress[norm(e.w)]; if(p) progress[norm(e.w)]=p; }
  allCache.progress=progress;
  return allCache;
}
const cur = () => curId===ALL_ID ? allDeck() : (decks.get(curId) || decks.get(BUILTIN_ID) || allDeck());
const prog = (d,e) => d.progress[norm(e.w)];
function grade(e, ok, neutral=false){
  const d=(e._d && decks.get(e._d)) || cur(), k=norm(e.w), p=d.progress[k] || {s:0, seen:0};
  p.seen++; if(!neutral) p.s = ok ? Math.min(5,p.s+1) : Math.max(0,p.s-2);
  p.last=Date.now(); d.progress[k]=p; scheduleSave(d); renderStats();
}
function counts(d){ let m=0,l=0,n=0; for(const e of d.words){ const p=prog(d,e); if(!p||!p.seen) n++; else if(p.s>=4) m++; else l++; } return {m,l,n,t:d.words.length}; }
function studyOrder(d){ return shuffle(d.words).sort((a,b)=>((prog(d,a)?.s ?? -1) - (prog(d,b)?.s ?? -1))); }

/* ---------- shared bits ---------- */
/* example sentence: the word being learned is bolded wherever it appears (any inflection) */
function markWord(sentence, w){
  const parts=String(w).toLowerCase().replace(/^(be|to)\s+/,'').split(/\s+/).filter(Boolean)
    .map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/(e|y)$/,'')+'[\\wāēīōū\'’-]*');
  if(!parts.length) return esc(sentence);
  let re; try{ re=new RegExp('((?<!\\p{L})'+parts.join('\\s+')+')','giu'); }catch{ return esc(sentence); }
  return String(sentence).split(re).map((t,i)=>i%2 ? `<b>${esc(t)}</b>` : esc(t)).join('');
}
function exampleBlock(e){
  return `<div class="line exl"><span class="sym vd" title="ví dụ">VD</span><div class="exbox">
    <div class="exen">${markWord(e.ex, e.w)}${canSpeak?` <button class="speak sm" type="button" data-act="speak" data-w="${esc(e.ex)}" aria-label="Nghe câu ví dụ">${SPEAK_SVG}</button>`:''}</div>
    ${e.exVi?`<div class="exvi">${esc(e.exVi)}</div>`:''}</div></div>`;
}
function detail(e, {withWord=false, viEdit=null}={}){
  return `<div class="detail">
    ${withWord?`<div class="wordline" style="margin-top:0"><span class="bigword" style="font-size:1.6rem">${esc(e.w)}</span>${e.ipa?`<span class="ipa">/${esc(e.ipa)}/</span>`:''}${speakBtn(e.w)}${posBadge(e,'push')}</div>`:''}
    <div class="line"><span class="sym eq" title="đồng nghĩa">=</span><div class="chips">${e.syn.map(s=>chip(e,s)).join('')}</div></div>
    ${e.ant.length?`<div class="line"><span class="sym neq" title="trái nghĩa">#</span><div class="chips">${e.ant.map(s=>chip(e,s,'a')).join('')}</div></div>`:''}
    ${(e.notes||[]).length?`<div class="line"><span class="sym root" title="gốc từ">( )</span><span class="rootnote">${e.notes.map(esc).join(' · ')}</span></div>`:''}
    ${viEdit ? viEditor(e, viEdit) : e.vi?`<div class="line vi"><span class="sym vn" title="nghĩa tiếng Việt">VI</span><span class="vitext">${esc(e.vi)}</span></div>`:''}
    ${e.ex?exampleBlock(e):''}
  </div>`;
}
function doneScreen(title, big, sub){
  return `<div class="panel done-screen"><span class="label">${esc(title)}</span><div class="big">${big}</div><p class="muted" style="margin:0">${sub}</p>
  <div class="row-btns"><button class="btn primary" data-act="restart">Học lượt mới</button><button class="btn" data-act="goto" data-mode="list">Xem danh sách</button></div></div>`;
}
const needWords = (n) => `<div class="panel empty">Chế độ này cần ít nhất ${n} từ trong bài. Thêm từ ở mục <button class="btn small" data-act="goto" data-mode="decks">Bài học</button></div>`;

/* ---------- render shell ---------- */
function renderDeckSel(){
  const sel=$('#deckSel'), all=allDeck();
  sel.innerHTML=`<option value="${ALL_ID}" ${curId===ALL_ID?'selected':''}>★ Tất cả từ đã lưu · ${all.words.length} từ</option><optgroup label="Từng bài">`
    + sortedDecks().map(d=>`<option value="${esc(d.id)}" ${d.id===curId?'selected':''}>${esc(d.name)} · ${d.words.length} từ</option>`).join('') + '</optgroup>';

function renderStats(){
  const c=counts(cur()), t=Math.max(1,c.t);
  $('#stats').innerHTML=`<div class="bar" aria-hidden="true"><i class="m" style="width:${c.m/t*100}%"></i><i class="l" style="width:${c.l/t*100}%"></i></div>
  <div class="statline">
    <span><i class="dot" style="background:var(--moss)"></i>Đã thuộc <b>${c.m}</b></span>
    <span><i class="dot" style="background:var(--gold)"></i>Đang học <b>${c.l}</b></span>

    <span class="legend"><span><code style="color:var(--moss)">=</code>đồng nghĩa</span><span><code style="color:var(--ant)">#</code>trái nghĩa</span><span><code style="color:var(--gold)">( )</code>gốc từ</span><span><code style="font-size:.75rem">VI</code>nghĩa tiếng Việt</span><span><code style="font-size:.75rem;color:var(--moss)">VD</code>ví dụ</span></span>
  </div>`;
}

function resetSessions(){ C=Q=T=M=S=null; viEditKey=null; posEditKey=null; }

/* ---------- 1. flashcards ---------- */
let C=null, cardDir='word';
function renderCards(){
  const d=cur();
  if(!d.words.length) return $('#stage').innerHTML=needWords(1);
  if(!C || C.deck!==d.id) C={deck:d.id, queue:studyOrder(d), flipped:false, good:0, seen:0};
  if(!C.queue.length) return $('#stage').innerHTML=doneScreen('Hết lượt thẻ', `${C.good}/${C.seen}`, 'lượt bấm “Nhớ rồi” trên tổng số lượt lật thẻ');
  const e=C.queue[0], p=prog(d,e);
  const front = cardDir==='word'
    ? `<div class="facehead"><span class="tag">Từ vựng · nhớ lại nghĩa</span><span class="headr">${posBadge(e)}${speakBtn(e.w)}</span></div>
       <div><div class="bigword">${esc(e.w)}</div>${e.ipa?`<div class="ipa" style="margin-top:6px">/${esc(e.ipa)}/</div>`:''}</div>
       <div class="hint">Chạm vào thẻ để xem từ đồng nghĩa</div>`
    : `<div class="facehead"><span class="tag">Nghĩa · nhớ lại từ</span><span class="ipa" style="font-size:.9rem">${e.w.length} ký tự · bắt đầu bằng “${esc([...e.w][0])}”</span></div>
       ${detail(e)}<div class="hint">Chạm vào thẻ để xem từ</div>`;
  const back = cardDir==='word'
    ? `<div class="facehead"><span class="tag">${esc(e.w)}</span><span class="headr">${posBadge(e)}${speakBtn(e.w)}</span></div>${detail(e)}`
    : `<div class="facehead"><span class="tag">Đáp án</span></div>${detail(e,{withWord:true})}`;
  $('#stage').innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="toolbar"><span class="count">Còn ${C.queue.length} thẻ${p?.seen?` · mức nhớ ${p.s}/5`:' · từ mới'}</span>
      <span class="seg" role="group" aria-label="Mặt trước của thẻ"><button data-act="dir" data-dir="word" aria-pressed="${cardDir==='word'}">Hiện từ</button><button data-act="dir" data-dir="mean" aria-pressed="${cardDir==='mean'}">Hiện nghĩa</button></span></div>
    <div class="flash" id="flash" role="button" tabindex="0" aria-label="Lật thẻ" data-act="flip">
      <div class="face" aria-hidden="${C.flipped}">${front}</div>
      <div class="face" aria-hidden="${!C.flipped}">${back}</div>
    </div>
    <div class="rate"><button class="btn" data-act="rate" data-ok="0">${C.flipped?'Chưa nhớ':'Chưa nhớ · xem đáp án'}</button><button class="btn primary" data-act="rate" data-ok="1">Nhớ rồi</button></div>
    <p class="keys"><kbd>Space</kbd> lật thẻ · <kbd>←</kbd> chưa nhớ · <kbd>→</kbd> nhớ rồi, sang từ tiếp</p></div>`;
}
function flip(){ if(!C) return; C.flipped=!C.flipped; renderCards(); }
function rate(ok){
  if(!C || !C.queue.length) return;
  if(!ok && !C.flipped){ C.flipped=true; renderCards(); return; }   // "not yet": show the answer first, next press moves on
  const e=C.queue.shift(); C.seen++; if(ok) C.good++;
  grade(e, ok);
  if(!ok) C.queue.splice(Math.min(3,C.queue.length),0,e);
  C.flipped=false; renderCards();
}

/* ---------- 2. quiz ---------- */
let Q=null;
function makeQ(e, pool){
  const others=shuffle(pool.filter(x=>x!==e));
  const types=['def2word','def2word','word2def'];
  if(e.ant.length) types.push('ant','ant');
  if(e.vi) types.push('vi2word','vi2word');
  let t=types[Math.random()*types.length|0];
  if(t==='vi2word') return {e, t, prompt:'Từ tiếng Anh nào có nghĩa', cue:e.vi, word:false, pre:'VI · ', opts:shuffle([e,...others.slice(0,3)]).map(x=>({label:x.w, ok:x===e}))};
  if(t==='ant'){
    const right=e.ant[Math.random()*e.ant.length|0];
    const banned=new Set(e.ant.map(norm));
    const cands=[...new Set([...e.syn.filter(s=>s.split(' ').length<=3), ...others.flatMap(x=>x.syn.filter(s=>s.split(' ').length<=3)), ...others.map(x=>x.w)])].filter(s=>!banned.has(norm(s)));
    const pick=[e.syn.find(s=>s.split(' ').length<=3)].filter(Boolean);
    for(const c of shuffle(cands)){ if(pick.length>=3) break; if(!pick.includes(c)) pick.push(c); }
    if(pick.length>=3) return {e, t, prompt:'Từ nào TRÁI NGHĨA với', cue:e.w, word:true, opts:shuffle([{label:right,ok:true}, ...pick.slice(0,3).map(l=>({label:l,ok:false}))])};
    t='def2word';
  }
  if(t==='word2def') return {e, t, prompt:'Nghĩa / từ đồng nghĩa của', cue:e.w, word:true, opts:shuffle([e,...others.slice(0,3)]).map(x=>({label:synText(x,2), ok:x===e}))};
  return {e, t, prompt:'Từ nào ứng với', cue:synText(e,3), word:false, opts:shuffle([e,...others.slice(0,3)]).map(x=>({label:x.w, ok:x===e}))};
}
function renderQuiz(){
  const d=cur();
  if(d.words.length<4) return $('#stage').innerHTML=needWords(4);
  if(!Q || Q.deck!==d.id){ const list=studyOrder(d).slice(0,Math.min(10,d.words.length)); Q={deck:d.id, list, i:0, right:0, q:makeQ(list[0], d.words), answered:null}; }
  if(Q.i>=Q.list.length) return $('#stage').innerHTML=doneScreen('Kết quả', `${Q.right}/${Q.list.length}`, 'câu trả lời đúng ngay lần đầu');
  const {q:qq}=Q, a=Q.answered;
  $('#stage').innerHTML=`<div class="panel">
    <div class="toolbar"><span class="count">Câu ${Q.i+1}/${Q.list.length}</span><span class="count">Đúng ${Q.right}</span></div>
    <div><div class="qprompt">${qq.prompt}</div><div class="qcue ${qq.word?'word':''}">${qq.word?esc(qq.cue):`${qq.pre??'= '}${esc(qq.cue)}`}${qq.word&&canSpeak?' '+speakBtn(qq.cue):''}</div></div>
    <div class="opts">${qq.opts.map((o,i)=>`<button class="opt ${a!=null?(o.ok?'right':(i===a?'wrong':'')):''}" data-act="ans" data-i="${i}" ${a!=null?'disabled':''}><span class="k">${i+1}</span><span class="t">${esc(o.label)}</span></button>`).join('')}</div>
    ${a!=null?`<div class="feedback"><div class="verdict ${qq.opts[a].ok?'ok':'no'}">${qq.opts[a].ok?'Chính xác.':'Chưa đúng. Ghi lại cả dòng này nhé:'}</div>${detail(qq.e,{withWord:true})}
      <div><button class="btn primary" data-act="nextq" id="nextq">Câu tiếp <kbd style="font-size:.75rem;opacity:.8">Enter</kbd></button></div></div>`:''}
  </div><p class="keys" style="margin-top:12px"><kbd>1</kbd>–<kbd>4</kbd> chọn đáp án · <kbd>Enter</kbd> câu tiếp</p>`;
  if(a!=null) $('#nextq')?.focus({preventScroll:true});
}
function answerQuiz(i){
  if(!Q||Q.answered!=null) return;
  Q.answered=i; const ok=Q.q.opts[i].ok; if(ok) Q.right++;
  grade(Q.q.e, ok); renderQuiz();
}

  const types=['recall','recall'];

    const opts=[...syns.slice(0,4).map(l=>({l,k:'syn'})), ...shuffle(e.ant).slice(0,2).map(l=>({l,k:'ant'}))];
    for(const p of otherPhr){ if(opts.length>=Math.max(6, syns.slice(0,4).length+3)) break; opts.push({l:p,k:'other'}); }

    return {t,e,opts:shuffle([...group.map(l=>({l,ok:false})),{l:odd,ok:true,ant:!!useAnt}]),ans:null};
  }
  if(t==='sort'){

function openViEdit(k){
  viEditKey=k; renderList();
  const inp=$('#vin'); if(!inp) return;
  inp.focus({preventScroll:true}); inp.select();
  inp.closest('.item')?.scrollIntoView({block:'nearest'});
}
function saveVi(k, value){
  const i=k.indexOf('::'), deck=decks.get(k.slice(0,i)), w=k.slice(i+2);
  const entry=deck?.words.find(x=>norm(x.w)===w);
  viEditKey=null;
  if(!entry){ renderList(); return; }
  const v=String(value).replace(/\|/g,'/').replace(/\s+/g,' ').trim();
  if(v!==(entry.vi||'')){ entry.vi=v; scheduleSave(deck); invalidateAll(); toast(v?`Đã lưu nghĩa của “${entry.w}”.`:`Đã xoá nghĩa của “${entry.w}”.`); }
  renderList();
  $(`[data-act="viedit"][data-k="${CSS.escape(k)}"]`)?.focus({preventScroll:true});
}

let trState={busy:false,msg:'',err:false};
async function translateMissing(){
  const d=cur(), miss=d.words.filter(e=>!e.vi).slice(0,80);
  if(!miss.length || trState.busy) return;
  if(IS_LOCAL && !settings.geminiKey){
    trState={busy:true,err:false,msg:`Đang dịch ${miss.length} từ…`}; renderList();
    const owners=d.virtual?[...decks.values()]:[d];
    const real=miss.map(e=>((e._d&&decks.get(e._d))||d).words.find(x=>norm(x.w)===norm(e.w))).filter(Boolean);
    const n=await freeVi(real).catch(()=>0);
    owners.forEach(o=>scheduleSave(o)); invalidateAll();
    trState={busy:false,err:!n,msg:n?`Đã thêm nghĩa tiếng Việt cho ${n} từ.`:'Chưa dịch được. Kiểm tra kết nối Internet rồi thử lại.'};
    return mode==='list' && renderList();
  }
  const eng=await getEngine();
  if(!eng?.json){ trState={busy:false,err:true,msg:IS_LOCAL?'Cần khóa API (tab Bài học → Cài đặt) để dịch tự động. Bạn cũng có thể tự thêm nghĩa sau dấu | cuối mỗi dòng.':'Dịch tự động không dùng được ở đây. Bạn có thể tự thêm nghĩa ở mục Bài học, sau dấu | cuối mỗi dòng.'}; return renderList(); }
  trState={busy:true,err:false,msg:`Claude đang dịch ${miss.length} từ…`}; renderList();
  try{
    const prompt=`For each English word below, give a short Vietnamese meaning that matches the sense shown by its synonyms or definition. Keep each meaning under 8 words, the way a Vietnamese learner writes it in a vocabulary notebook.
Reply with only a JSON array of {"word": string, "vi": string}, same words, same order.

` + miss.map(e=>`${e.w} = ${e.syn.join(', ')}`).join('\n');
    const out=await eng.json(prompt);
    const map=new Map((Array.isArray(out)?out:[]).map(x=>[norm(x?.word||''), String(x?.vi||'').trim()]));
    let n=0; const touched=new Set();
    for(const e of miss){
      const v=map.get(norm(e.w)); if(!v) continue;
      const owner=(e._d && decks.get(e._d)) || d;
      const real=owner.words.find(x=>norm(x.w)===norm(e.w));
      if(real) real.vi=v;
      e.vi=v; touched.add(owner); n++;
    }
    touched.forEach(o=>scheduleSave(o));
    trState={busy:false,err:!n,msg:n?`Đã thêm nghĩa tiếng Việt cho ${n} từ. Có thể sửa lại ở mục Bài học.`:'Chưa dịch được từ nào. Bấm thử lại.'};
  }catch(e){
    const map={bad_key:'Khóa API không đúng. Kiểm tra lại ở Cài đặt.', quota:'Gemini đã hết lượt miễn phí hôm nay. Thử lại ngày mai.', network:'Không kết nối được Internet.', rate_limited:'Đang gửi quá nhiều yêu cầu. Thử lại sau ít phút.', not_granted:'Bạn chưa cho phép trang dùng Claude để dịch.', session_expired:'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.'};
    trState={busy:false,err:true,msg:map[e?.code]||'Có lỗi khi dịch. Bấm thử lại.'};
  }
  if(mode==='list') renderList();
}

let prState={busy:false,msg:'',err:false};
async function fillPron(){
  const d=cur(), miss=[...missingPron(d).values()].slice(0,150);
  if(!miss.length || prState.busy) return;
  if(IS_LOCAL && !settings.geminiKey){
    prState={busy:true,err:false,msg:'Đang tìm phiên âm…'}; renderList();
    const owners=d.virtual?[...decks.values()]:[d];
    let n=0;
    for(const o of owners){
      const si=await freeIPA(o.words).catch(()=>({}));
      for(const e of o.words) for(const s of [...e.syn,...e.ant]){ const k=norm(s); if(si[k] && !e.si?.[k]){ (e.si ||= {})[k]=si[k]; n++; } }
      scheduleSave(o);
    }
    invalidateAll();
    prState={busy:false,err:!n,msg:n?`Đã thêm phiên âm cho ${n} từ. Cụm nhiều chữ không có phiên âm tự động, nhưng vẫn bấm nghe được.`:'Không tìm thêm được phiên âm (cụm nhiều chữ hoặc mất mạng). Bạn vẫn bấm vào từ để nghe.'};
    return mode==='list' && renderList();
  }
  const eng=await getEngine();
  if(!eng?.json){ prState={busy:false,err:true,msg:IS_LOCAL?'Cần khóa API (tab Bài học → Cài đặt) để thêm phiên âm tự động. Bạn vẫn bấm vào từng từ để nghe đọc.':'Thêm phiên âm tự động không dùng được ở đây. Bạn vẫn có thể bấm vào từng từ để nghe đọc.'}; return renderList(); }
  prState={busy:true,err:false,msg:`Claude đang viết phiên âm cho ${miss.length} từ…`}; renderList();
  try{
    const out=await eng.json(`Give the British English IPA transcription for each English word or phrase below, written the way a learner's dictionary writes it (with stress marks, no slashes). For a phrase, transcribe the whole phrase.
Reply with only a JSON object whose keys are the words or phrases exactly as given and whose values are the IPA strings.
Example: {"night-active":"ˌnaɪt ˈæktɪv","scarce":"skeəs"}

` + miss.join('\n'));
    const got=new Map(Object.entries(out && typeof out==='object' && !Array.isArray(out) ? out : {})
      .map(([k,v])=>[norm(k), String(v ?? '').trim().replace(/^\/|\/$/g,'')]).filter(([,v])=>v));
    const want=new Set(miss.map(norm)); let n=0;
    for(const o of (d.virtual ? [...decks.values()] : [d])){
      let changed=false;
      for(const e of o.words) for(const s of [...e.syn,...e.ant]){ const k=norm(s); if(got.has(k) && !e.si?.[k]){ (e.si ||= {})[k]=got.get(k); changed=true; } }
      if(changed) scheduleSave(o);
    }
    for(const k of got.keys()) if(want.has(k)) n++;
    invalidateAll();
    prState={busy:false,err:!n,msg:n?`Đã thêm phiên âm cho ${n} từ đồng nghĩa và trái nghĩa.`:'Chưa lấy được phiên âm. Bấm thử lại.'};
  }catch(e){
    const map={bad_key:'Khóa API không đúng. Kiểm tra lại ở Cài đặt.', quota:'Gemini đã hết lượt miễn phí hôm nay. Thử lại ngày mai.', network:'Không kết nối được Internet.', rate_limited:'Đang gửi quá nhiều yêu cầu. Thử lại sau ít phút.', not_granted:'Bạn chưa cho phép trang dùng Claude.', session_expired:'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.'};
    prState={busy:false,err:true,msg:map[e?.code]||'Có lỗi khi lấy phiên âm. Bấm thử lại.'};
  }
  renderStats();
  if(mode==='list') renderList();
}

async function deleteDecks(ids){
  const names=ids.map(id=>decks.get(id)?.name).filter(Boolean);
  let failed=0;
  for(const id of ids){
    if(!decks.has(id)) continue;
    decks.delete(id);
    if(E?.id===id) newEditor(null);
    try{
      if(id===BUILTIN_ID) await store.put({id, name:'(đã xoá)', words:[], progress:{}, created:0, deleted:true});
      else await store.del(id);
    }catch{ failed++; }
  }
  invalidateAll(); validCur(); resetSessions(); saveUI(); renderAll();
  toast(failed ? `Chưa xoá được ${failed} bài trên bộ lưu. Thử lại sau.` : names.length===1 ? `Đã xoá “${names[0]}”.` : `Đã xoá ${names.length} bài.`);
}

async function geminiSave(){
  const key=($('#gemkey')?.value||'').trim(), chosen=$('#gemmodel')?.value||'';
  if(!key){ gemState={...gemState,msg:'Hãy dán khóa API trước.',err:true}; return renderDecks(); }
  gemState={...gemState,busy:true,msg:'',err:false}; renderDecks(); $('#gembox')?.setAttribute('open','');
  const prevKey=settings.geminiKey; settings.geminiKey=key;
  try{
    const models=await geminiListModels();

    const pick = key===prevKey && models.includes(chosen) ? chosen : geminiPick(models);
    settings.geminiModel=pick; saveSettings();
    gemState={busy:false,err:false,models,msg:`Đã bật Gemini (${pick}). Từ giờ ảnh sẽ được đọc bằng Gemini.`};
    engKind='gemini'; imgOK=true;

    settings.geminiKey=prevKey;

async function shrinkImage(file){
  try{
    const bmp=await createImageBitmap(file); const k=Math.min(1, 1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
    const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob); });

}

  const out=[]; let chunk=[], len=0;
  const flush=async()=>{
    if(!chunk.length) return;
    const j=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q='+encodeURIComponent(chunk.join('\n')));
    const lines=(j?.[0]||[]).map(x=>x?.[0]||'').join('').split('\n').map(x=>x.trim());
    out.push(...(lines.length===chunk.length ? lines : chunk.map(()=> '')));
    chunk=[]; len=0;
  };
  for(const t of texts){ if(len+t.length>1200) await flush(); chunk.push(t.replace(/\n/g,' ')); len+=t.length+1; }
  await flush();
  return out;
}
async function viMyMemory(text){
  const j=await fetchJSON('https://api.mymemory.translated.net/get?langpair=en%7Cvi&q='+encodeURIComponent(text));
  const t=j?.responseData?.translatedText;
  if(!t || /MYMEMORY|QUERY LENGTH|INVALID/i.test(t)) throw {code:'mm'};
  return t;
}
/* translate each headword; if it comes back untranslated (a name like kākāpō), translate its definition instead */
async function freeVi(entries){
  const todo=entries.filter(e=>!e.vi); if(!todo.length) return 0;
  const words=todo.map(e=>e.w);
  let res=[]; try{ res=await viGoogle(words); }catch{ res=[]; }
  let n=0;
  await runPool(todo.map((e,i)=>async()=>{
    let v=res[i];
    if(!v){ try{ v=await viMyMemory(e.w); }catch{} }
    if(!v || norm(v)===norm(e.w)){
      const ctx=e.syn.slice(0,2).join(', ');
      try{ v=(await viGoogle([ctx]))[0] || await viMyMemory(ctx); }catch{ try{ v=await viMyMemory(ctx); }catch{} }
    }
    if(v && norm(v)!==norm(e.w)){ e.vi=tidyVi(v); n++; }
  }), 4);
  return n;
}
async function freePOS(entries){
  let n=0;
  await runPool(entries.filter(e=>!e.pos).map(e=>async()=>{
    if(/\s/.test(e.w)){ e.pos='phr'; n++; return; }
    const j=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=bd&q='+encodeURIComponent(e.w), 7000);
    const p=normPOS(j?.[1]?.[0]?.[0]);
    if(p){ e.pos=p; n++; }
  }), 4);
  return n;
}
async function freeEx(entries, limit=60){
  const got=[];
  await runPool(entries.filter(e=>!e.ex && !/\s/.test(e.w)).slice(0,limit).map(e=>async()=>{
    const j=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=ex&q='+encodeURIComponent(e.w), 7000);
    const list=(j?.[13]?.[0]||[]).map(x=>String(x?.[0]||'').replace(/<[^>]+>/g,'').trim()).filter(t=>t && t.length<170);
    if(list[0]){ let t=list[0]; t=t[0].toUpperCase()+t.slice(1); if(!/[.!?]$/.test(t)) t+='.'; e.ex=t; got.push(e); }
  }), 4);
  if(got.length){ const vi=await viGoogle(got.map(e=>e.ex)).catch(()=>[]); got.forEach((e,i)=>{ e.exVi=tidyVi(vi[i]||'') ? vi[i].trim() : ''; }); }
  return got.length;
}
async function ipaFree(word){
  const j=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()), 6000);
  const ph=(j?.[0]?.phonetics||[]).map(p=>p?.text).filter(Boolean);
  const t=j?.[0]?.phonetic || ph.find(x=>/[ˈˌ]/.test(x)) || ph[0] || '';
  return t.replace(/^[\/\[]|[\/\]]$/g,'').trim();
}
/* fill missing IPA: offline dictionary first, online dictionary only for single words it lacks */
async function freeIPA(entries, limit=60){
  const si={}, jobs=[], seen=new Set();
  for(const e of entries){
    if(!e.ipa){ const o=ipaOffline(e.w); if(o) e.ipa=o; else if(/^[A-Za-z]+$/.test(e.w)) jobs.push(async()=>{ const t=await ipaFree(e.w); if(t) e.ipa=t; }); }
    for(const p of [...e.syn,...e.ant]){
      const k=norm(p);
      if(seen.has(k) || isDef(e,p) || ipaOf(e,p) || !/^[A-Za-z]+$/.test(p)) continue;
      seen.add(k); jobs.push(async()=>{ const t=await ipaFree(p); if(t) si[k]=t; });
    }
  }
  await runPool(jobs.slice(0,limit), 4);
  return si;
}
async function prepForOCR(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.max(1, Math.min(2.5, 2200/Math.max(bmp.width,bmp.height)));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const g=c.getContext('2d'); g.filter='grayscale(1) contrast(1.25)'; g.drawImage(bmp,0,0,c.width,c.height);
    return c;
  }catch{ return file; }
}
async function ocrImages(files, onProgress){
  if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  let idx=0;
  const worker=await Tesseract.createWorker('eng', 1, {logger:m=>{ if(m.status==='recognizing text') onProgress(Math.round(((idx+m.progress)/files.length)*100)); }});
  let text='';
  try{ for(const f of files){ const {data}=await worker.recognize(await prepForOCR(f)); text+=data.text+'\n'; idx++; } }
  finally{ await worker.terminate(); }
  return ocrToLines(text);
}

/* JSON from Claude, the Gemini API, or pasted from the Gemini app: {title, entries:[{word, synonyms, antonyms, notes, ipa, vi, pos, pron}]} */
function findEntries(data){
  if(Array.isArray(data)) return data;
  if(!data || typeof data!=='object') return [];
  for(const k of ['entries','words','vocabulary','vocab','items','list','data','results']) if(Array.isArray(data[k])) return data[k];
  for(const v of Object.values(data)){ if(Array.isArray(v) && v.some(x=>x && typeof x==='object')) return v; }
  for(const v of Object.values(data)){ if(v && typeof v==='object' && !Array.isArray(v)){ const r=findEntries(v); if(r.length) return r; } }
  // {"nocturnal": {...}, "pale": {...}}
  const vals=Object.entries(data).filter(([,v])=>v && typeof v==='object' && !Array.isArray(v));
  return vals.length ? vals.map(([k,v])=>({word:k, ...v})) : [];
}
async function importStructured(data, from){
  const arr = findEntries(data);
  const str = v => String(v ?? '').trim();
  const list = a => (Array.isArray(a) ? a : (typeof a==='string' && a ? (/[,;]/.test(a) && !/^(a|an|the)\s/i.test(a) ? a.split(/\s*[,;]\s*/) : [a]) : [])).map(v=>typeof v==='object'&&v ? (v.text||v.word||v.value||'') : v).map(str).filter(Boolean);
  const pick = (x, ...ks) => { for(const k of ks){ if(x?.[k]!=null && x[k]!=='' && !(Array.isArray(x[k])&&!x[k].length)) return x[k]; } return ''; };
  const entries = arr.map(x=>{
    const w=str(pick(x,'word','headword','term','Word','english','en','root'));
    let syn=list(pick(x,'synonyms','synonym','Synonyms','meanings','meaning','equivalents'));
    if(!syn.length){ const d=str(pick(x,'definition','definition_en','explanation','gloss')); if(d) syn=[d]; }
    return {w, syn, ant:list(pick(x,'antonyms','antonym','Antonyms','opposites')), notes:list(pick(x,'notes','roots','root_notes','etymology')).map(n=>n.includes('=')?n:n+' ='),
      ipa:str(pick(x,'ipa','IPA','pronunciation','phonetic')).replace(/^[\/\[]|[\/\]]$/g,''), vi:str(pick(x,'vi','vietnamese','meaning_vi','nghia','translation')).replace(/\|/g,'/'),
      pos:normPOS(pick(x,'pos','part_of_speech','partOfSpeech','type'))||guessPOS(w),
      ex:str(pick(x,'example','ex','example_en','sentence')).replace(/\|/g,'/'), exVi:str(pick(x,'example_vi','exampleVi','example_translation','translation_example')).replace(/\|/g,'/')};
  }).filter(e=>e.w && e.syn.length);
  for(const e of entries) if(!e.ex){ delete e.ex; delete e.exVi; }
  if(!entries.length){ imgStatus={msg:`Không tìm thấy từ nào trong ${from}. Thử lại với ảnh rõ hơn hoặc cắt sát phần từ vựng.`,err:true,busy:false}; return 'empty'; }
  for(const x of arr){
    const p=x?.pron;
    if(Array.isArray(p)) for(const it of p){ const k=str(it?.text||it?.word||it?.phrase), ip=str(it?.ipa).replace(/^[\/\[]|[\/\]]$/g,''); if(k&&ip) E.pron[norm(k)]=ip; }
    else if(p && typeof p==='object') for(const [k,v] of Object.entries(p)){ const ip=str(v).replace(/^[\/\[]|[\/\]]$/g,''); if(ip) E.pron[norm(k)]=ip; }
  }
  E.text = (E.text.trim() ? E.text.trimEnd()+'\n' : '') + entries.map(toLine).join('\n');
  if(!E.name.trim()) E.name = str(data?.title) || ('Bài ' + new Date().toLocaleDateString('vi-VN'));
  imgStatus={msg:'',err:false,busy:false};
  if(settings.autoSave){ await saveDeck(`Đã đọc ${entries.length} từ từ ${from} và lưu thành bài “${E.name.trim()}”. Muốn sửa thì vào tab Bài học.`); return true; }
  imgStatus={msg:`Đã thêm ${entries.length} từ vào danh sách. Kiểm tra lại rồi bấm lưu.`,err:false,busy:false};
  return false;
}
/* plain "word [pos] = syn, syn #ant /ipa/ | vi" lines (OCR or pasted): fill what is missing, then save */
async function importLines(lines, {fbNote='', setMsg=null, ocr=false}={}){
  const entries=parseText(lines).entries;
  if(!entries.length){ imgStatus={msg:'Không tìm thấy dòng nào dạng “từ = nghĩa”. '+(ocr?'Thử ảnh rõ, thẳng và đủ sáng hơn.':'Kiểm tra lại nội dung đã dán.')+fbNote,err:true,busy:false}; return false; }
  const missing=entries.some(e=>!e.vi||!e.pos||!e.ipa||!e.ex);
  let nVi=entries.filter(e=>e.vi).length;
  if(missing){
    setMsg?.(`${ocr?'Bước 2/2 · ':''}Đã đọc ${entries.length} từ. Đang thêm nghĩa tiếng Việt và phiên âm…`);
    const [v, si] = await Promise.all([freeVi(entries).catch(()=>0), freeIPA(entries).catch(()=>({})), freePOS(entries).catch(()=>0), freeEx(entries).catch(()=>0)]);
    nVi+=v; Object.assign(E.pron, si);
    for(const e of entries) if(!e.pos) e.pos=guessPOS(e.w);
  }
  E.text=(E.text.trim()?E.text.trimEnd()+'\n':'')+entries.map(toLine).join('\n');
  if(!E.name.trim()) E.name=(ocr?'Ảnh ':'Bài ') + (d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`)(new Date());
  const viNote = nVi ? '' : ' Chưa lấy được nghĩa tiếng Việt (kiểm tra Internet), có thể bấm dịch lại ở tab Danh sách.';
  imgStatus={msg:'',err:false,busy:false};
  if(settings.autoSave){ await saveDeck(`Đã đọc ${entries.length} từ và lưu thành bài “${E.name.trim()}”.`+(ocr?' Nếu OCR đọc sai chữ nào, sửa ở tab Bài học.':'')+viNote+fbNote); return true; }
  imgStatus={msg:`Đã đọc ${entries.length} từ. Kiểm tra lại rồi bấm lưu.`+viNote+fbNote,err:false,busy:false};
  return false;
}
/* text pasted from the Gemini app (JSON block) or typed lines */
async function importPasted(text){
  text=String(text||'').trim(); if(!text) return false;
  if(!E) newEditor(null);
  let data=null; try{ data=parseLooseJSON(text); }catch{}
  if(data && typeof data==='object' && findEntries(data).length){
    const ok=await importStructured(data, 'kết quả Gemini');
    if(ok!==true && mode==='decks') renderDecks();
    return true;
  }
  if(parseText(text).entries.length){
    imgStatus={msg:'Đang thêm nghĩa tiếng Việt và phiên âm…',err:false,busy:true}; if(mode==='decks') renderDecks();
    const ok=await importLines(text, {setMsg:m=>{ imgStatus={msg:m,err:false,busy:true}; }});
    if(!ok && mode==='decks') renderDecks();
    return true;
  }
  return false;
}

async function exportBackup(){

  const data=JSON.stringify({app:'so-tu-dong-nghia', version:1, exported:new Date().toISOString(),
    decks:sortedDecks().map(d=>({id:d.id, name:d.name, words:d.words, progress:d.progress||{}, created:d.created||0}))});
  if(!IS_LOCAL){
    const dl=await window.claude.use('downloads');
    if(!dl){ toast('Trang này không tải tệp xuống được.'); return; }
    try{ await dl.save({filename:name, data}); }catch(e){ if(e?.code!=='cancelled' && e?.code!=='declined') toast('Chưa tải được tệp sao lưu.'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Đã tạo tệp sao lưu trong thư mục Tải xuống.');

async function importBackup(file){

  const list=Array.isArray(j?.decks)?j.decks:[]; let n=0;

  }
  invalidateAll(); resetSessions(); renderAll();
  toast(n?`Đã khôi phục ${n} bài.`:'Không có bài nào trong tệp.');

async function saveDeck(msg){
  const pr=parseText(E.text);
  if(!pr.entries.length){ toast('Chưa có từ nào đúng định dạng “từ = nghĩa”.'); return; }
  const name=E.name.trim() || 'Bài ' + new Date().toLocaleDateString('vi-VN');
  for(const e of pr.entries) for(const s of [...e.syn,...e.ant]){ const k=norm(s); if(E.pron?.[k]) (e.si ||= {})[k]=E.pron[k]; }
  let d;
  if(E.id && decks.has(E.id)){ d=decks.get(E.id); d.name=name; d.words=pr.entries; }
  else { d={id:uid(), name, words:pr.entries, progress:{}, created:Date.now()}; decks.set(d.id,d); }
  invalidateAll(); curId=d.id; resetSessions(); newEditor(null);
  await flush(d.id);
  toast(msg || `Đã lưu “${name}” · ${d.words.length} từ. Từ mới cũng có trong “Tất cả từ đã lưu”.`);
  mode='cards'; saveUI(); renderAll();
}

  ml:b=>matchPick('l',+b.dataset.i),

  restart:()=>{ resetSessions(); renderMode(); },
  goto:b=>{ mode=b.dataset.mode; saveUI(); renderTabs(); renderMode(); },
  reset:()=>{ if(!resetArmed){ resetArmed=true; return renderList(); } const d=cur(); resetArmed=false;
    if(d.virtual){ for(const x of decks.values()){ x.progress={}; scheduleSave(x); } resetSessions(); renderStats(); renderList(); return toast('Đã đặt lại tiến độ mọi bài.'); }
    d.progress={}; resetSessions(); scheduleSave(d); renderStats(); renderList(); toast('Đã đặt lại tiến độ.'); },
  use:b=>{ curId=b.dataset.id; resetSessions(); saveUI(); renderAll(); },
  edit:b=>{ newEditor(decks.get(b.dataset.id)); renderDecks(); $('#ename')?.scrollIntoView({behavior:'smooth',block:'center'}); },
  del:async b=>{ const id=b.dataset.id; if(delArmed!==id){ delArmed=id; return renderDecks(); } delArmed=null; await deleteDecks([id]); },
  selmode:()=>{ selMode=!selMode; selIds.clear(); selArmed=false; delArmed=null; renderDecks(); },
  selall:()=>{ const all=sortedDecks().map(d=>d.id); if(selIds.size===all.length) selIds.clear(); else all.forEach(i=>selIds.add(i)); selArmed=false; renderDecks(); },
  seldel:async()=>{ if(!selIds.size) return; if(!selArmed){ selArmed=true; return renderDecks(); } const ids=[...selIds]; selMode=false; selIds.clear(); selArmed=false; await deleteDecks(ids); },
  wdel:b=>deleteWord(b.dataset.k),
  save:()=>saveDeck(),
  newdeck:()=>{ newEditor(null); renderDecks(); },
  stopimg:()=>imgCtl?.abort(),
  translate:()=>translateMissing(),
  viedit:b=>openViEdit(b.dataset.k),
  posedit:b=>{ posEditKey=b.dataset.k; viEditKey=null; renderList(); },
  fillpos:()=>fillPOS(),
  fillex:()=>fillEx(),
  vicancel:()=>{ viEditKey=null; renderList(); },
  backup:()=>exportBackup(),
  gemsave:()=>geminiSave(),
  gappcopy:b=>copyGeminiPrompt(b),
  gappimport:async()=>{ const t=$('#gapppaste')?.value||''; if(!t.trim()){ toast('Hãy dán kết quả từ Gemini vào ô trước.'); return; } const ok=await importPasted(t); if(!ok) toast('Không đọc được kết quả. Hãy sao chép cả khung code mà Gemini trả về.'); },
  gemclear:()=>{ settings.geminiKey=''; settings.geminiModel=''; saveSettings(); gemState={busy:false,msg:'Đã tắt Gemini. Ảnh sẽ được đọc bằng OCR miễn phí.',err:false,models:[]}; engKind='ocr'; renderDecks(); $('#gembox')?.setAttribute('open',''); },
  spick:b=>synPick(+b.dataset.i),
  scheck:()=>synCheck(),
  sodd:b=>synOdd(+b.dataset.i),
  ssort:b=>synSort(b.dataset.k),
  snext:()=>synNext(),
  shint:()=>{ const q=S.q; q.hint=Math.min(q.hint+1, 6); renderSyn(); },
  pron:()=>fillPron(),
};
$('#addImg').addEventListener('click',()=>{
  if(mode!=='decks'){ mode='decks'; delArmed=null; saveUI(); renderTabs(); }
  renderDecks();
  if(imgOK===false){ $('#etext')?.focus(); toast('Đọc ảnh không dùng được ở đây. Hãy gõ hoặc dán từ vào ô danh sách.'); return; }
  $('#drop')?.scrollIntoView({behavior:'smooth',block:'center'});
  $('#imgin')?.click();
});
$('#stage').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act!=='flip' && b.closest('#flash')) ev.stopPropagation();
  if(b.dataset.act==='flip' && ev.target.closest('.speak')) return;
  acts[b.dataset.act]?.(b, ev);
});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest?.('input,textarea,select')) return;
  if(mode==='cards' && C){
    if(ev.code==='Space' || (ev.key==='Enter' && ev.target.id==='flash')){ ev.preventDefault(); flip(); }
    else if(ev.key==='ArrowRight') rate(true);
    else if(ev.key==='ArrowLeft') rate(false);
  } else if(mode==='quiz' && Q){
    if(/^[1-4]$/.test(ev.key) && Q.answered==null && Q.q && +ev.key<=Q.q.opts.length) answerQuiz(+ev.key-1);
    else if(ev.key==='Enter' && Q.answered!=null && !ev.target.closest?.('button')){ ev.preventDefault(); nextQuiz(); }
  } else if(mode==='syn' && S && S.q && S.i<S.list.length){
    const q=S.q, n=+ev.key, answered = q.t==='pick' ? q.done : q.t==='recall' ? !!q.res : q.ans!=null;
    if(!answered && /^[1-9]$/.test(ev.key)){
      if(q.t==='pick' && n<=q.opts.length) synPick(n-1);
      else if(q.t==='odd' && n<=4) synOdd(n-1);
      else if(q.t==='sort' && n<=2) synSort(n===1?'syn':'ant');
    } else if(ev.key==='Enter' && !ev.target.closest?.('button')){
      if(answered){ ev.preventDefault(); synNext(); }
      else if(q.t==='pick'){ ev.preventDefault(); synCheck(); }
    }
  }
});

/* ---------- boot ---------- */
function mergeProgress(a={}, b={}){ const out={...a}; for(const k in b){ if(!out[k] || (b[k].seen||0)>(out[k].seen||0)) out[k]=b[k]; } return out; }
/* pictures were removed: clear what earlier versions stored */
try{ indexedDB.deleteDatabase('sotu-images'); }catch{}
/* website build: installable app + offline cache (never inside Claude, never from a local file) */
if(IS_LOCAL && location.protocol==='https:' && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
let installEvt=null;
window.addEventListener('beforeinstallprompt',ev=>{ ev.preventDefault(); installEvt=ev; $('#installBtn').hidden=false; });
$('#installBtn').addEventListener('click',async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch{} installEvt=null; $('#installBtn').hidden=true; });
window.addEventListener('appinstalled',()=>{ $('#installBtn').hidden=true; toast('Đã cài ứng dụng. Tìm “Sổ Từ Đồng Nghĩa” trong Start hoặc màn hình chính.'); });
/* the pronunciation dictionary loads in the background; refresh once it arrives */
window.sotuIpaReady = () => {
  IPA_MAP=null;
  for(const d of decks.values()) for(const e of d.words) if(!e.ipa){ const o=ipaOffline(e.w); if(o) e.ipa=o; }
  invalidateAll();
  if(!viEditKey && !posEditKey && !document.activeElement?.matches?.('input,textarea,select')) renderMode();
};
renderAll();
(async()=>{
  await store.init();
  let stored=[]; try{ stored=await store.all(); }catch{}
  for(const s of stored){
    if(!s || !s.id) continue;
    if(s.deleted){ decks.delete(s.id); continue; }     // a deleted sample lesson stays deleted
    if(!Array.isArray(s.words)) continue;
    if(s.words.some(w=>'img' in w || 'imgQ' in w)){ s.words=s.words.map(({img,imgQ,...w})=>w); s._clean=true; }
    const have=decks.get(s.id);
    if(s.id===BUILTIN_ID && have){ const src=new Map(have.words.map(e=>[norm(e.w),e])); s.words=s.words.map(e=>{ const b=src.get(norm(e.w)); return b ? {...e, vi:e.vi||b.vi||'', pos:e.pos||b.pos||''} : e; }); }
    decks.set(s.id, {...s, progress:mergeProgress(s.progress, have?.progress), builtin:s.id===BUILTIN_ID, created:s.id===BUILTIN_ID?0:(s.created||1)});
  }
  /* website: lessons published with the site (decks.json) are added once to this browser; local edits and deletions are respected */
  let seededN=0;
  if(IS_LOCAL && /^https?:$/.test(location.protocol)){
    try{
      const r=await fetch('decks.json',{cache:'no-cache'});
      if(r.ok){
        const j=await r.json(); let seeded={};
        try{ const raw=JSON.parse(localStorage.getItem('sotu.seeded')||'{}'); seeded=Array.isArray(raw)?Object.fromEntries(raw.map(id=>[id,1])):(raw||{}); }catch{}
        const storedIds=new Set(stored.map(x=>x?.id));
        let updatedN=0;
        for(const sd of (j.decks||[])){
          if(!sd?.id || !Array.isArray(sd.words)) continue;
          const rev=sd.rev||j.rev||1;
          if(seeded[sd.id]!=null){
            if(rev>seeded[sd.id]){
              const local=decks.get(sd.id);
              if(local){
                const src=new Map(sd.words.map(x=>[norm(x.w),x])); let ch=false;
                for(const e of local.words){ const x=src.get(norm(e.w)); if(!x) continue;
                  for(const f of ['ex','exVi','pos','vi','ipa']) if(!e[f] && x[f]){ e[f]=x[f]; ch=true; } }
                if(ch){ updatedN++; await flush(sd.id); }
              }
              seeded[sd.id]=rev;
            }
            continue;
          }
          seeded[sd.id]=rev;
          if(storedIds.has(sd.id)){
            /* the untouched sample lesson in this browser gives way to the published version of it */
            const cur0=decks.get(sd.id);
            if(sd.id===BUILTIN_ID && cur0 && cur0.name==='Kākāpō (bài mẫu)' && sd.name!==cur0.name){
              decks.set(sd.id,{...cur0, name:String(sd.name), words:sd.words, progress:mergeProgress(sd.progress||{}, cur0.progress)}); seededN++; await flush(sd.id);
            }
            continue;
          }
          decks.set(sd.id,{id:sd.id, name:String(sd.name||'Bài'), words:sd.words, progress:sd.progress||{}, created:sd.id===BUILTIN_ID?0:(sd.created||Date.now()), builtin:sd.id===BUILTIN_ID});
          seededN++; await flush(sd.id);
        }
        try{ localStorage.setItem('sotu.seeded',JSON.stringify(seeded)); }catch{}
        if(updatedN) setTimeout(()=>toast(`Đã cập nhật ví dụ và thông tin mới cho ${updatedN} bài có sẵn.`), 400);
      }
    }catch{}
  }
  for(const d of decks.values()) if(d._clean){ delete d._clean; flush(d.id); }
  if(window.SOTU_IPA_DATA) for(const d of decks.values()) for(const e of d.words) if(!e.ipa){ const o=ipaOffline(e.w); if(o) e.ipa=o; }
  invalidateAll();
  if(seededN) toast(`Đã thêm ${seededN} bài có sẵn trên trang.`);
  try{ const s=JSON.parse(localStorage.getItem('sotu.ui')||'{}'); if(s.cur && decks.has(s.cur) && curId===BUILTIN_ID) curId=s.cur; }catch{}
  validCur();
  renderDeckSel(); renderStats();
  if(stored.length || seededN){ resetSessions(); renderMode(); }
  const eng = await getEngine().catch(()=>null);
  engKind = eng?.kind || null;
  imgOK = !!eng?.images;
  if(mode==='decks') renderDecks();
})();
</script>
